<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Su Sayaç Yönetim</title><meta name="theme-color" content="#0e7490">
<style>
:root{--bg:#f4f7f9;--card:#fff;--tx:#10222c;--mu:#5b6f7a;--ln:#dbe4ea;--pr:#0e7490;--bad:#c92a2a;--ok:#2b8a3e}
@media(prefers-color-scheme:dark){:root{--bg:#0b1419;--card:#121e25;--tx:#e6eef2;--mu:#8ea3ae;--ln:#243540;--pr:#22b8cf;--bad:#ff6b6b;--ok:#69db7c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:16px;padding-bottom:90px}
h1{font-size:20px;margin:4px 0 14px}.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}input[type=text],input[type=password],input[type=date],input[type=number]{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;font-weight:600}button.g{background:transparent;color:var(--pr);border:1px solid var(--ln)}button.r{background:transparent;color:var(--bad);border:1px solid var(--ln)}
.dev{border-top:1px solid var(--ln);padding:12px 0}.dev:first-child{border-top:0}.top{display:flex;gap:8px;align-items:center;justify-content:space-between}.kod{font:700 18px ui-monospace,monospace;letter-spacing:1px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--ln);display:flex;gap:8px}.bar button{flex:1}
#msg{font-size:14px;margin:6px 0;min-height:20px}.mu{color:var(--mu);font-size:13px}.sw{display:flex;align-items:center;gap:8px;margin-top:10px}
</style></head><body>
<h1>🔐 Su Sayaç Yönetim</h1>
<div class="card" id="cfg">
  <label>GitHub kullanıcı / repo</label>
  <div class="row" style="margin:0"><input type="text" id="own" placeholder="kullanıcı" style="flex:1"><input type="text" id="rep" placeholder="repo" style="flex:1"></div>
  <label>Erişim anahtarı (token)</label><input type="password" id="tok" placeholder="github_pat_…" autocomplete="off">
  <p class="mu">Anahtar sadece bu telefonun tarayıcısında saklanır. Sadece bu repoya “Contents: Read and write” izni ver.</p>
  <div class="row"><button id="load">Bağlan ve yükle</button><button class="g" id="forget">Anahtarı sil</button></div>
</div>
<div id="msg"></div>
<div id="main" hidden>
  <div class="card"><b>Cihazlar</b><p class="mu" style="margin:2px 0 0">Listede olmayan cihaz kilitli kalır ve ekranında kodunu gösterir.</p><div id="devs"></div>
    <label>Yeni cihaz kodu</label><input type="text" id="nk" placeholder="örn. FA62A68C" autocapitalize="characters" maxlength="16">
    <label>Cihaz adı (isteğe bağlı)</label><input type="text" id="na" placeholder="örn. Belediye telefonu">
    <div class="row"><button id="add">Ekle</button></div></div>
  <div class="card"><b>Genel</b>
    <label class="sw"><input type="checkbox" id="all"> Tüm cihazları kapat (acil durum)</label>
    <label>Kilit ekranı mesajı</label><input type="text" id="mes">
    <label>İnternetsiz çalışma süresi (gün)</label><input type="number" id="gun" min="1" max="90"></div>
</div>
<div class="bar" id="bar" hidden><button id="save">GitHub'a kaydet</button></div>
<script>
const $=s=>document.querySelector(s);let J=null,SHA=null,dev=[];
const LS={g:k=>{try{return localStorage.getItem(k)||''}catch{return''}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const m=(t,bad)=>{$('#msg').textContent=t;$('#msg').style.color=bad?'var(--bad)':'var(--tx)'};
$('#own').value=LS.g('own')||(location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'filmarama');
$('#rep').value=LS.g('rep')||(location.hostname.endsWith('.github.io')&&location.pathname.split('/')[1]||'su-sayac-lisans');
$('#tok').value=LS.g('tok');
const api=(m_,body)=>fetch(`https://api.github.com/repos/${$('#own').value.trim()}/${$('#rep').value.trim()}/contents/lisans.json`,{method:m_||'GET',headers:{Authorization:'Bearer '+$('#tok').value.trim(),Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body),cache:'no-store'});
const dec=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,''))));const enc=t=>btoa(unescape(encodeURIComponent(t)));
const U=s=>String(s).trim().toUpperCase();
function render(){
  $('#devs').innerHTML=dev.length?dev.map((d,i)=>`<div class="dev"><div class="top"><span class="kod">${d.kod}</span><span class="pill ${d.acik?'ok':'bad'}">${d.acik?'açık':'kapalı'}</span></div>
  <div class="mu">${d.ad?esc(d.ad):'adsız'}</div>
  <label>Son kullanma tarihi (boş = süresiz)</label><input type="date" data-b="${i}" value="${d.bitis||''}">
  <div class="row"><button class="g" data-c="${i}">Süresiz yap</button><button class="g" data-t="${i}">${d.acik?'Kapat':'Aç'}</button><button class="g" data-n="${i}">Adı değiştir</button><button class="r" data-d="${i}">Sil</button></div></div>`).join(''):'<p class="mu">Liste boş</p>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#devs').addEventListener('input',e=>{const i=e.target.dataset.b;if(i!=null)dev[i].bitis=e.target.value});
$('#devs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.c!=null)dev[d.c].bitis='';
  else if(d.t!=null)dev[d.t].acik=!dev[d.t].acik;
  else if(d.n!=null){const v=prompt('Cihaz adı',dev[d.n].ad||'');if(v!=null)dev[d.n].ad=v.trim()}
  else if(d.d!=null){if(!confirm(dev[d.d].kod+' silinsin mi? Silinen cihaz kilitlenir.'))return;dev.splice(d.d,1)}
  render()});
$('#add').onclick=()=>{const k=U($('#nk').value);if(!/^[0-9A-Z]{4,16}$/.test(k))return m('Kod harf ve rakamdan oluşmalı',1);if(dev.some(d=>d.kod===k))return m('Bu kod zaten listede',1);
  dev.push({kod:k,ad:$('#na').value.trim(),bitis:'',acik:true});$('#nk').value='';$('#na').value='';m('Eklendi. Kaydetmeyi unutma.');render()};
$('#load').onclick=async()=>{
  LS.s('own',$('#own').value.trim());LS.s('rep',$('#rep').value.trim());LS.s('tok',$('#tok').value.trim());m('Yükleniyor…');
  try{const r=await api();
    if(r.status===404){J={};SHA=null;m('lisans.json bulunamadı, yeni oluşturulacak.')}
    else if(!r.ok)throw new Error(r.status===401?'Anahtar geçersiz':'Hata '+r.status);
    else{const x=await r.json();SHA=x.sha;J=JSON.parse(dec(x.content));m('Yüklendi')}
    const iz=Array.isArray(J.izinli)?J.izinli.map(U):[],ka=(J.kapali||[]).map(U);
    const all=[...new Set([...iz,...ka,...Object.keys(J.bitis||{}).map(U)])];
    dev=all.map(k=>({kod:k,ad:(J.adlar||{})[k]||'',bitis:(J.bitis||{})[k]||'',acik:!ka.includes(k)}));
    $('#all').checked=!!J.hepsiKapali;$('#mes').value=J.mesaj||'Kullanım kapatıldı. Yetkiliye başvurun.';$('#gun').value=J.cevrimdisiGun||14;
    $('#main').hidden=$('#bar').hidden=false;render();
  }catch(e){m(e.message||'Bağlanılamadı',1)}};
$('#save').onclick=async()=>{
  const o={...J};o.izinli=dev.map(d=>d.kod);o.kapali=dev.filter(d=>!d.acik).map(d=>d.kod);
  o.bitis={};dev.forEach(d=>{if(d.bitis)o.bitis[d.kod]=d.bitis});o.adlar={};dev.forEach(d=>{if(d.ad)o.adlar[d.kod]=d.ad});
  o.hepsiKapali=$('#all').checked;o.mesaj=$('#mes').value.trim();o.cevrimdisiGun=Math.max(1,+$('#gun').value||14);
  if(!dev.some(d=>d.acik)&&!confirm('Hiçbir cihaz açık değil, herkes kilitlenecek. Devam?'))return;
  m('Kaydediliyor…');
  try{const body={message:'lisans guncelle (panel)',content:enc(JSON.stringify(o,null,2)+'\n')};if(SHA)body.sha=SHA;
    const r=await api('PUT',body);if(!r.ok)throw new Error(r.status===409||r.status===422?'Dosya başka yerde değişmiş, “Bağlan ve yükle”ye basıp tekrar dene':'Kaydedilemedi ('+r.status+')');
    const x=await r.json();SHA=x.content.sha;J=o;m('✅ Kaydedildi. Telefonlar birkaç dakikada görür.')}catch(e){m(e.message,1)}};
$('#forget').onclick=()=>{LS.s('tok','');$('#tok').value='';m('Anahtar silindi')};
if(LS.g('tok'))$('#load').click();
</script></body></html>
